[pytest]
testpaths = tests
# tests/test_deep.py is excluded from the default run and must be invoked
# explicitly: on macOS torch's bundled OpenMP runtime and the one behind
# rasterio/xgboost cannot coexist in one process (it segfaults during
# test_end_to_end_synthetic), and merely importing torch at collection time is
# enough to trigger it. Run the two suites separately:
#     pytest -q tests                 # pipeline suite
#     pytest -q tests/test_deep.py    # deep-learning suite
#     ./run_tests.sh                  # both, in sequence
addopts = --ignore=tests/test_deep.py
markers =
    slow: end-to-end tests that take ~30 s
    torch: tests that require PyTorch (run in their own process)
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning
