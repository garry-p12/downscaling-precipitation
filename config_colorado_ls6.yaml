# Colorado Front Range: the terrain-rich counterpart to the Austin domain.
#
# Austin is 30 x 35 = 1050 coarse cells with 0.000 of cells above 5 deg slope.
# This box is deliberately the SAME SIZE so the comparison is controlled: only
# the terrain regime changes. It spans the Continental Divide (Longs Peak
# 4346 m, Mt Evans 4348 m) in the west, the Front Range urban corridor
# (Denver, Boulder, Fort Collins) in the middle, and high plains in the east.
#
# Unlike config_wide.yaml, the relief sits INSIDE the evaluation box rather
# than outside it. That is the whole point: the wide-domain test showed the
# model can learn orography but has nothing to apply it to in flat Texas.
project_root: .

domain:
  name: colorado_front_range
  bbox: [-107.0, 38.5, -104.0, 42.0]   # 30 x 35 = 1050 coarse cells, matching Austin exactly
  coarse_res_deg: 0.1
  fine_factor: 12

time:
  start: "2000-06-01"
  end: "2020-12-31"
  train_start: "2000-06-01"
  train_end: "2017-12-31"
  val_start: "2019-01-01"
  val_end: "2020-12-31"

data:
  imerg:
    short_name: GPM_3IMERGDF
    version: "07"
    variable: auto
    mode: opendap
    workers: 4
    keep_raw: false
  aorc:
    bucket: noaa-nws-aorc-v1-1-1km
    variable: APCP_surface
  nlcd:
    year: 2021
    wcs_url: https://www.mrlc.gov/geoserver/ows
    landcover_coverage: mrlc_download__NLCD_2021_Land_Cover_L48
    impervious_coverage: mrlc_download__NLCD_2021_Impervious_L48
    tile_km: 60
    dem_source: copernicus_glo90
    dem_resampling: average

features:
  rolling_days: 7
  neighborhood: 3
  include_doy: true
  include_latlon: false
  use_era5: true

model:
  coarse:
    type: xgb
    early_stopping_rounds: 40
    params:
      n_estimators: 2000
      max_depth: 4
      learning_rate: 0.02
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 5
  fine:
    type: xgb
    early_stopping_rounds: 40
    max_samples: 3000000
    val_samples: 500000
    seed: 42
    # Same 0.5% gate as Austin. In Texas this rejected the residual stage on
    # every configuration tried; if terrain carries sub-grid information it
    # should pass here.
    min_gain_over_bilinear: 0.005
    params:
      n_estimators: 2000
      max_depth: 4
      learning_rate: 0.02
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 20

upsampling:
  method: auto
  lapse_alpha: -0.0002
  conserve_mass: false
  time_chunk: 32

validation:
  heavy_threshold_mm: 30.0
  intensity_bins_mm: [1.0, 10.0, 30.0]
  complex_terrain_slope_deg: 5.0
  qq_samples: 200000
  sample_locations:
    - {name: Denver, lat: 39.74, lon: -104.99}
    - {name: Boulder, lat: 40.01, lon: -105.27}
    - {name: Fort Collins, lat: 40.59, lon: -105.08}
    - {name: Estes Park, lat: 40.38, lon: -105.52}
    - {name: Winter Park, lat: 39.89, lon: -105.77}
    - {name: Steamboat Springs, lat: 40.48, lon: -106.83}
    - {name: Greeley, lat: 40.42, lon: -104.71}

paths:
  raw: /work/11755/gurup12/ls6/dsc-data-co/raw
  processed: /work/11755/gurup12/ls6/dsc-data-co
  auxiliary: /work/11755/gurup12/ls6/dsc-data-co/auxiliary
  models: models/colorado
  results: results/colorado
