# Wide-domain training configuration (cluster paths).
# Trains over 8 deg of longitude reaching real terrain (Edwards Plateau,
# Davis Mountains: 21% of cells above 5 deg slope at W104 vs 0% at Austin),
# but EVALUATES only on evaluation.bbox - the original Austin box - so the
# numbers stay directly comparable with the flat-domain runs.
project_root: .
domain:
  name: texas_wide
  bbox:
  - -104.0
  - 28.5
  - -96.0
  - 32.0
  coarse_res_deg: 0.1
  fine_factor: 12
time:
  start: '2000-06-01'
  end: '2020-12-31'
  train_start: '2000-06-01'
  train_end: '2017-12-31'
  val_start: '2019-01-01'
  val_end: '2020-12-31'
data:
  imerg:
    short_name: GPM_3IMERGDF
    version: '07'
    variable: auto
    mode: opendap
    workers: 4
    keep_raw: false
  aorc:
    bucket: noaa-nws-aorc-v1-1-1km
    variable: APCP_surface
  nlcd:
    year: 2021
    wcs_url: https://www.mrlc.gov/geoserver/ows
    landcover_coverage: mrlc_download__NLCD_2021_Land_Cover_L48
    impervious_coverage: mrlc_download__NLCD_2021_Impervious_L48
    tile_km: 60
    dem_source: copernicus_glo90
    dem_resampling: average
features:
  rolling_days: 7
  neighborhood: 3
  include_doy: true
  include_latlon: false
  use_era5: true
model:
  coarse:
    type: xgb
    early_stopping_rounds: 40
    params:
      n_estimators: 2000
      max_depth: 4
      learning_rate: 0.02
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 5
    rf_params:
      n_estimators: 200
      max_depth: 12
      min_samples_split: 20
  fine:
    type: xgb
    early_stopping_rounds: 40
    max_samples: 3000000
    val_samples: 500000
    seed: 42
    min_gain_over_bilinear: 0.005
    params:
      n_estimators: 2000
      max_depth: 4
      learning_rate: 0.02
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 20
upsampling:
  method: auto
  lapse_alpha: -0.0002
  conserve_mass: false
  time_chunk: 32
validation:
  heavy_threshold_mm: 30.0
  intensity_bins_mm:
  - 1.0
  - 10.0
  - 30.0
  complex_terrain_slope_deg: 5.0
  qq_samples: 200000
  sample_locations:
  - name: Austin
    lat: 30.27
    lon: -97.74
  - name: San Antonio
    lat: 29.42
    lon: -98.49
  - name: Waco
    lat: 31.55
    lon: -97.15
  - name: San Marcos
    lat: 29.88
    lon: -97.94
  - name: Fredericksburg
    lat: 30.27
    lon: -98.87
  - name: Georgetown
    lat: 30.63
    lon: -97.68
  - name: Bastrop
    lat: 30.11
    lon: -97.32
paths:
  raw: data_wide/raw
  processed: data_wide
  auxiliary: data_wide/auxiliary
  models: models/wide
  results: results/wide
evaluation:
  bbox:
  - -99.0
  - 28.5
  - -96.0
  - 32.0
  name: austin_holdout
